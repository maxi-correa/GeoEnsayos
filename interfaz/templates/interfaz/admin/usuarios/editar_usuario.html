{% extends "base_admin.html" %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-body">

            <h3 class="mb-4">Editar Usuario</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" 
                            value="{{ usuario_editado.username }}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="first_name" 
                            value="{{ usuario_editado.first_name }}"
                            class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="last_name" 
                            value="{{ usuario_editado.last_name }}"
                            class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">Nueva Contraseña (opcional)</label>
                    <div class="input-group">
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="Dejar vacío para no modificar su contraseña">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                {% if request.user != usuario_editado %}
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" required>
                        <option value="tecnico"
                            {% if usuario_editado.perfil.rol == "tecnico" %}selected{% endif %}>
                            Técnico
                        </option>
                        <option value="consulta"
                            {% if usuario_editado.perfil.rol == "consulta" %}selected{% endif %}>
                            Solo consulta
                        </option>
                    </select>
                </div>
                {% endif %}

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" 
                            name="is_active"
                            {% if usuario_editado.is_active %}checked{% endif %}>
                    <label class="form-check-label">
                        Usuario Activo
                    </label>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">
                        Volver
                    </a>
                    <button type="submit" class="btn btn-success">
                        Guardar Cambios
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword() {
    const input = document.getElementById("id_password");
    const icon = event.currentTarget.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>
{% endblock %}
