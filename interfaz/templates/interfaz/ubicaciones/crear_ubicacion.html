{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            Nueva Ubicación
        </div>
        
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nombre del barrio / ubicación</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success">Guardar</button>
                <a href="{% url 'lista_ubicaciones' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
