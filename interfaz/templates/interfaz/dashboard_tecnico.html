<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard Técnico</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <h1>Dashboard Técnico</h1>

        <h2>Resumen de ensayos</h2>
        <ul>
            <li>Pendientes: {{ pendientes }}</li>
            <li>En Proceso: {{ en_proceso }}</li>
            <li>Finalizados: {{ finalizados }}</li>
            <li>Validados: {{ validados }}</li>
        </ul>

        <h2>Obras Activas</h2>
        <ul>
            {% for obra in obras %}
                <li>{{ obra.nombre }}</li>
            {% empty %}
                <li>No hay obras activas.</li>
            {% endfor %}
        </ul>
    </body>
</html>
