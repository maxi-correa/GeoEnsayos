{% extends "base.html" %}
{% block content %}

<div class="container mt-4" style="max-width: 700px;">
    <h2>Crear Nueva Obra</h2>

    <form method="post">
        {% csrf_token %}

        <div class="card shadow-sm p-4 mt-3">

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="d-flex justify-content-end">
                <a href="{% url 'dashboard_admin' %}" class="btn btn-secondary me-2">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-success">
                    Guardar
                </button>
            </div>

        </div>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
    //SCRIPT PARA FORMATEAR EL NÚMERO DE EXPEDIENTE EN TIEMPO REAL

    document.addEventListener("DOMContentLoaded", function() {

        const expedienteInput = document.getElementById("id_numero_expediente");

        expedienteInput.addEventListener("input", function(e) {

            let value = this.value.replace(/\D/g, "");

            if (value.length > 12) {
                value = value.slice(0, 12);
            }

            let formatted = "";

            if (value.length > 0) {
                formatted += value.substring(0, 4);
            }
            if (value.length >= 5) {
                formatted += " - " + value.substring(4, 8);
            }
            if (value.length >= 9) {
                formatted += " - " + value.substring(8, 12);
            }

            this.value = formatted;
        });
    });
</script>

<script>
    // SCRIPT PARA FORMATEAR EL NÚMERO DE LICITACIÓN EN TIEMPO REAL

    document.addEventListener("DOMContentLoaded", function() {

        const licInput = document.getElementById("id_numero_licitacion");

        licInput.addEventListener("input", function(e) {

            let value = this.value.replace(/\D/g, "");

            if (value.length > 6) {
                value = value.slice(0, 6);
            }

            this.value = value + "/2025-SIOySP";
        });

    });
</script>
{% endblock %}
